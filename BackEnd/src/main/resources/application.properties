spring.application.name=e_app
spring.profiles.active=local

# PostgreSQL connection — no real secret committed here. Actual local password
# goes in application-local.properties (gitignored) or the DB_PASSWORD env var.
spring.datasource.url=jdbc:postgresql://localhost:5432/e_app_dev
spring.datasource.username=${DB_USERNAME:e_app_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# GraphQL
spring.graphql.graphiql.enabled=true
spring.graphql.cors.allowed-origins=*

# Auth (JWT) — secret thật đặt trong application-local.properties / env JWT_SECRET.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:10080}

# OAuth (Google/Facebook) — Client ID/App ID không phải bí mật (public trong
# app client), nên commit thẳng là an toàn. Vẫn override được qua env nếu cần.
app.oauth.google.client-id=${GOOGLE_CLIENT_ID:763477988188-j4pb1ntmed6nar0ng5s8c9ndjh0okb2h.apps.googleusercontent.com}
app.oauth.facebook.app-id=${FACEBOOK_APP_ID:1317749868090961}

# Quyền quản trị nội dung (khoá học): danh sách email, phân tách bằng dấu phẩy.
app.admin-emails=${ADMIN_EMAILS:}
